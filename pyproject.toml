[project]
name = "geotani"
version = "0.1.0"
description = "Open-source agricultural land suitability mapping & geospatial intelligence for Indonesia"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    {name = "Robit Al Hazmi"}
]

[tool.setuptools.packages.find]
include = ["api*", "etl*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
