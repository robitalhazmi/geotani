name: taniscope

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: taniscope-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taniscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taniscope_dev}
      POSTGRES_DB: ${POSTGRES_DB:-taniscope}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taniscope}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: taniscope-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-taniscope}:${POSTGRES_PASSWORD:-taniscope_dev}@db:5432/${POSTGRES_DB:-taniscope}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/app/api
      - ./etl:/app/etl
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  tiles:
    image: ghcr.io/maplibre/martin:v0.15.0
    container_name: taniscope-tiles
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-taniscope}:${POSTGRES_PASSWORD:-taniscope_dev}@db:5432/${POSTGRES_DB:-taniscope}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    # Martin will auto-discover PostGIS tables and serve them as vector tiles

volumes:
  postgres_data:
