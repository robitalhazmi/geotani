name: geotani-prod

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: geotani-prod-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geotani}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geotani_prod}
      POSTGRES_DB: ${POSTGRES_DB:-geotani}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geotani} -d ${POSTGRES_DB:-geotani}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: geotani-prod-api
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-geotani}:${POSTGRES_PASSWORD:-geotani_prod}@db:5432/${POSTGRES_DB:-geotani}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://geotani.cloud,https://www.geotani.cloud}
    volumes:
      - geotani_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 4

  tiles:
    image: ghcr.io/maplibre/martin:v0.15.0
    container_name: geotani-prod-tiles
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-geotani}:${POSTGRES_PASSWORD:-geotani_prod}@db:5432/${POSTGRES_DB:-geotani}
    depends_on:
      db:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: geotani-prod-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-geotani.cloud}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - tiles

volumes:
  postgres_prod_data:
  geotani_data:
  caddy_data:
  caddy_config:
